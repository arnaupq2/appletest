name: Build VoiceDubAI iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify complete local native modules
        run: |
          set -uo pipefail
          required_files=(
            "modules/AppleFoundationTranslator/package.json"
            "modules/AppleFoundationTranslator/index.js"
            "modules/AppleFoundationTranslator/expo-module.config.json"
            "modules/AppleFoundationTranslator/ios/AppleFoundationTranslatorModule.swift"
            "modules/AppleFoundationTranslator/ios/AppleFoundationTranslator.podspec"
            "modules/VoiceCache/package.json"
            "modules/VoiceCache/index.js"
            "modules/VoiceCache/expo-module.config.json"
            "modules/VoiceCache/ios/VoiceCacheModule.swift"
            "modules/VoiceCache/ios/VoiceCache.podspec"
            "modules/VoiceDubEngine/package.json"
            "modules/VoiceDubEngine/index.js"
            "modules/VoiceDubEngine/expo-module.config.json"
            "modules/VoiceDubEngine/ios/VoiceDubEngineModule.swift"
            "modules/VoiceDubEngine/ios/VoiceDubEngine.podspec"
            "plugins/with-fluid-audio.js"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "::error title=Missing repository file::$file is missing. Upload this file at the exact path from the ZIP."
              missing=1
            fi
          done
          echo "--- Current repository files under modules/ ---"
          find modules -maxdepth 5 -type f -print | sort || true
          if [ "$missing" -ne 0 ]; then
            echo "The repository is missing required module files. Make sure the ZIP contents were uploaded to the repository root, not just the ZIP itself."
            exit 1
          fi
          echo "Both local Expo modules are present."

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Diagnose and install CocoaPods
        run: |
          set -euo pipefail

          echo "=== Generated Podfile ==="
          cat ios/Podfile

          echo "=== Autolinking resolution ==="
          npx expo-modules-autolinking resolve --platform apple

          echo "=== Install CocoaPods with verbose output ==="
          cd ios
          pod install --verbose
      
      - name: Diagnose missing AppleFoundationTranslator
        if: always()
        run: |
          echo "=== package.json autolinking config ==="
          node -e "console.log(JSON.stringify(require('./package.json').expo?.autolinking, null, 2))"

          echo "=== Expo module search ==="
          npx expo-modules-autolinking search

          echo "=== Expo Apple resolution ==="
          npx expo-modules-autolinking resolve --platform apple

          echo "=== Generated Podfile autolinking lines ==="
          grep -n -E 'use_expo_modules|autolink|AppleFoundationTranslator|VoiceCache' ios/Podfile || true

          echo "=== Translator podspec ==="
          cat modules/AppleFoundationTranslator/ios/AppleFoundationTranslator.podspec

          echo "=== Translator module files ==="
          find modules/AppleFoundationTranslator -maxdepth 4 -type f -print | sort

          echo "=== CocoaPods references ==="
          grep -R -n 'AppleFoundationTranslator' ios/Podfile ios/Pods/Manifest.lock ios/Pods/Local\ Podspecs 2>/dev/null || true

      - name: Verify native modules are linked into iOS
        run: |
          set -euo pipefail

          echo "=== CocoaPods local podspecs ==="
          find "ios/Pods/Local Podspecs" -maxdepth 1 -type f -print | sort

          test -f "ios/Pods/Local Podspecs/AppleFoundationTranslator.podspec.json" || {
            echo "::error::AppleFoundationTranslator no aparece en CocoaPods."
            exit 1
          }

          test -f "ios/Pods/Local Podspecs/VoiceCache.podspec.json" || {
            echo "::error::VoiceCache no aparece en CocoaPods."
            exit 1
          }

          test -f "ios/Pods/Local Podspecs/VoiceDubEngine.podspec.json" || {
            echo "::error::VoiceDubEngine no aparece en CocoaPods."
            exit 1
          }

          grep -q 'FluidAudio' "ios/Pods/Local Podspecs/VoiceDubEngine.podspec.json" || {
            echo "::error::VoiceDubEngine no declara FluidAudio."
            exit 1
          }

          echo "Los módulos nativos y FluidAudio están presentes en CocoaPods."
      - name: Patch FluidAudio CocoaPods resource accessor
        run: |
          set -euo pipefail
          # FluidAudio's SwiftPM manifest generates Bundle.module, but its CocoaPods
          # podspec includes LuxTTS sources without a CocoaPods resource bundle.
          # VoiceDubAI uses PocketTTS, not LuxTTS; patch the unused G2P resource lookup
          # so the complete FluidAudio target still compiles under CocoaPods.
          file="ios/Pods/FluidAudio/Sources/FluidAudio/TTS/LuxTts/G2p/LuxTtsG2p.swift"
          if [ -f "$file" ]; then
            python3 - "$file" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          path.write_text(source.replace("Bundle.module", "Bundle.main"))
          PY
          fi

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ios/VoiceDubAI.xcworkspace \
            -scheme VoiceDubAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=\"\" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceDubAI.app Payload/
          /usr/bin/zip -qry VoiceDubAI-AppleGlass-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDubAI-AppleGlass-unsigned-ipa
          path: VoiceDubAI-AppleGlass-unsigned.ipa
          retention-days: 7
